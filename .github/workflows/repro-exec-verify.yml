# Repro-exec verify — Build 2b sandbox (decision memo 2026-07-21).
#
# Executes MODEL-GENERATED repro tests to prove a bug reproduces on the
# reviewed SHA and stops reproducing on the patch. Model-generated code is
# treated as HOSTILE, so the pipeline is split into three jobs with a hard
# trust boundary between them:
#
#   fetch  (HAS secrets)  — DB + Anthropic + GitHub; authors repro specs and
#                            pre-materializes bare git mirrors. Runs NO model
#                            code. Uploads specs + mirrors.
#   exec   (NO secrets)   — permissions: {}, no secrets in the environment, and
#                            the actual repro runs inside `docker run
#                            --network none` with our deps mounted. This job is
#                            THE isolation boundary — repro-verifier.ts is not.
#   record (HAS db secret)— writes one review_gate_outcomes row per verdict,
#                            idempotent, with witnessability provenance
#                            (run URL + workflow SHA + verdict digest).
#
# Operator-run via workflow_dispatch. The exec job's isolation is enforced
# structurally AND asserted by scripts/repro-exec-workflow.contract.test.ts.
#
# KNOWN first-run validations (this PR ships the audited structure; the first
# live dispatch confirms end-to-end plumbing): (a) mirror-path portability
# across the fetch→exec runner hop (handled by the tar-preserving-/tmp step),
# (b) the exec image toolchain covers JS/TS repros first — go/pytest repros
# degrade to a safe `no_runner` inconclusive until added to the image.

name: Repro-exec verify

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max repro generation attempts (fetch phase)"
        required: false
        default: "5"
      repo:
        description: "Restrict to a single owner/repo (optional)"
        required: false
        default: ""
      record:
        description: "Write verdicts to the DB (false = dry-run)"
        type: boolean
        required: false
        default: false

# Least privilege at the top; jobs widen only what they need.
permissions: {}

# Serialize runs — the record phase is idempotent per (review, finding) via
# the DB index, but overlapping fetch phases would waste generation budget.
concurrency:
  group: repro-exec-verify
  cancel-in-progress: false

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "11.1.2"
  # Pin os.tmpdir() to /tmp on every job so the fetch-phase mirror path
  # (dirname must equal tmpdir(), per isSafeLocalMirrorDir) survives the hop
  # to the exec runner, where the tarball restores it to the same /tmp path.
  TMPDIR: /tmp

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch — author repro specs + pin mirrors
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.REPRO_FETCH_GITHUB_TOKEN }}
        run: |
          pnpm exec tsx scripts/repro-verify-batch.ts \
            --phase fetch \
            --limit "${{ inputs.limit }}" \
            ${{ inputs.repo != '' && format('--repo {0}', inputs.repo) || '' }} \
            --out "$GITHUB_WORKSPACE/repro-specs.json"
      - name: Bundle mirrors (preserve /tmp paths for the exec runner)
        run: |
          # Mirrors are mkdtemp'd directly under /tmp with a fixed prefix. Tar
          # them relative to / so `tar xf -C /` on the exec runner restores the
          # exact absolute paths the specs reference.
          if ls /tmp/antfleet-mirror-* >/dev/null 2>&1; then
            tar czf "$GITHUB_WORKSPACE/repro-mirrors.tgz" -C / tmp/antfleet-mirror-*
          else
            echo "no mirrors produced (no eligible candidates) — emitting empty tar"
            tar czf "$GITHUB_WORKSPACE/repro-mirrors.tgz" -C / --files-from /dev/null
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repro-specs
          path: |
            repro-specs.json
            repro-mirrors.tgz
          retention-days: 1
          if-no-files-found: error

  exec:
    needs: fetch
    runs-on: ubuntu-latest
    # ZERO privileges and ZERO secrets: this job runs hostile model code.
    permissions: {}
    steps:
      # First-party actions only in this job (no third-party actions on the
      # hostile-code path). pnpm comes from corepack (bundled with node).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install our deps (trusted; network allowed here, NOT in exec)
        run: |
          corepack enable
          corepack prepare "pnpm@${{ env.PNPM_VERSION }}" --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repro-specs
          path: ${{ github.workspace }}
      - name: Restore mirrors to /tmp
        run: tar xzf "$GITHUB_WORKSPACE/repro-mirrors.tgz" -C /
      - name: Exec repros inside a --network none container
        run: |
          # The hostile repro runs here: no network, no secrets (clean env, only
          # ANTFLEET_REPRO_SANDBOX passed), read-only workspace + mirrors, a
          # writable /out for the verdicts, /tmp writable for worktrees. The
          # batch script additionally fails closed if any non-allowlisted env
          # var is present (assertNoSecretsInEnv).
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --network none \
            --env-file /dev/null \
            -e ANTFLEET_REPRO_SANDBOX=1 \
            -v "$GITHUB_WORKSPACE:/w:ro" \
            -v "/tmp:/tmp" \
            -v "$RUNNER_TEMP/out:/out" \
            -w /w/apps/web \
            node:26-bookworm@sha256:219fc9da91e7f29a9f32290ff598cdf8886fd68f421ff515c8f93434da39a271 \
            node_modules/.bin/tsx scripts/repro-verify-batch.ts \
              --phase exec \
              --in /w/repro-specs.json \
              --out /out/repro-verdicts.json
          cp "$RUNNER_TEMP/out/repro-verdicts.json" "$GITHUB_WORKSPACE/repro-verdicts.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repro-verdicts
          path: repro-verdicts.json
          retention-days: 1
          if-no-files-found: error

  record:
    needs: exec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: repro-verdicts
          path: ${{ github.workspace }}
      - name: Record verdicts (idempotent; witnessability provenance from env)
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm exec tsx scripts/repro-verify-batch.ts \
            --phase record \
            --in "$GITHUB_WORKSPACE/repro-verdicts.json" \
            ${{ inputs.record && '--record' || '' }}
