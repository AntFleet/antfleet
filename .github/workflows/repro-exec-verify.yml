# Contained CI repro-execution (#145 part 3/3).
#
# ⚠️ THIS WORKFLOW EXECUTES MODEL-GENERATED CODE. ⚠️
# The `exec` step runs a verifier (apps/web/scripts/repro-verify-batch.ts
# --phase verify-one) that spawns repro commands an LLM authored. Treat that code
# as untrusted / attacker-influenced.
#
# CONTAINMENT = a kernel-enforced Docker sandbox, NOT a process-level firewall.
# Each spec runs in its OWN container started with:
#   --network none            (no network interface exists in the container —
#                              the model repro cannot reach the internet or the
#                              runner's metadata endpoint; a payload cannot
#                              `sudo iptables -F` its way out, because there is
#                              no interface to re-enable)
#   --user <uid:gid>          (non-root; drops the ambient host-root the default
#                              container user would have)
#   --cap-drop ALL --security-opt no-new-privileges
#   --pids-limit / --memory / --cpus   (blast-radius caps)
# The container's own /proc + env are namespace-isolated from the host, so the
# payload cannot read the host's secrets, and its PID namespace dies with
# `docker run`, so no grandchild process survives into the later record step.
#
# ── PROVENANCE (#145 Part 3, Issue 1): ONE container PER SPEC, verdict = EXIT CODE.
# The exec step runs `--phase verify-one --index <i>` per spec. The container's
# EXIT CODE is the verdict DECISION (0=verified, 20=regressed, 30=inconclusive;
# any other code → inconclusive). The untrusted repro is a DESCENDANT of PID 1, so
# it can only DOWNGRADE the result by killing PID 1 (a 128+signal exit → treated as
# inconclusive) — it can NEVER forge a `verified` (0), which the launcher emits
# ONLY when the verifier itself returned verified. Each container also writes a
# best-effort evidence file to the writable /out mount; that file is
# payload-writable and its self-reported verdict is IGNORED by `assemble` — the
# decision comes from the captured exit code alone.
#
# ── OFFLINE deps (#145 Part 3, Issue 2): the sandbox has NO network, so the target
# project's deps can't be installed. verify-one runs with skipTestSuite — the
# generated repro IS the regression test (exit-0-pre ∧ concrete-non-zero-post) and
# the project test suite is skipped, so a missing-deps suite can NOT cause a false
# `regressed`.
#
# THE EXEC STEP PASSES NO SECRETS. Do NOT add DATABASE_URL, ANTHROPIC_API_KEY,
# GITHUB_TOKEN, or any other credential to the exec `docker run` — the
# container's `assertNoSecretsInEnv` (allowlist-only, fail-closed) is the proof
# that the env separation held and will REFUSE to run if a secret leaks in.
#
# STATUS: this workflow has NEVER been executed. It is inert (workflow_dispatch
# only) and must NOT be trusted until an operator has test-dispatched it on a
# KNOWN-SAFE input and reviewed the result.
#
# HARDENING FOLLOW-UP (documented, not yet done): run the exec step on a
# separate, ephemeral VM/runner that has NEVER held any repository secret, so
# even a total container escape lands on a machine with nothing to steal. Today
# fetch (with secrets) and exec (no secrets) share one runner VM; the container
# is the boundary between them.

name: repro-exec-verify

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max generation attempts to fetch (integer)"
        required: false
        default: "5"
      repo:
        description: "Optional owner/repo filter (empty = all eligible)"
        required: false
        default: ""
      record:
        description: "Write verdicts to review_gate_outcomes (money-path side table)"
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

# Least privilege at the top level: this workflow only ever reads the repo.
permissions:
  contents: read

jobs:
  repro-exec-verify:
    runs-on: ubuntu-latest
    # Top-level ceiling so a stuck descendant can never keep the whole run alive.
    timeout-minutes: 60
    steps:
      # Do NOT persist the checkout's git credential on disk — the exec step
      # bind-mounts $PWD into the untrusted container, so a leftover token under
      # .git would be readable by model-generated code.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # DEFENSE vs expression-injection: the dispatch inputs are read into env
      # (never interpolated inline into a run script), then validated in bash with
      # WHOLE-STRING bash matches (`=~` / `==`) — NOT `grep -Eq`, which accepts a
      # multiline value where an early line matches. Every later use is via the
      # validated $LIMIT / $REPO / $RECORD env, quoted. Any invalid input fails.
      - name: Validate inputs
        env:
          LIMIT: ${{ inputs.limit }}
          REPO: ${{ inputs.repo }}
          RECORD: ${{ inputs.record }}
        run: |
          set -euo pipefail
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || [ "$LIMIT" == 0 ]; then
            echo "::error::limit must be a positive integer (got: $LIMIT)"
            exit 1
          fi
          if ! [[ -z "$REPO" || "$REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::repo must be empty or match owner/repo (got: $REPO)"
            exit 1
          fi
          if ! [[ "$RECORD" == true || "$RECORD" == false ]]; then
            echo "::error::record must be true or false (got: $RECORD)"
            exit 1
          fi
          echo "inputs validated: limit=$LIMIT repo=${REPO:-<all>} record=$RECORD"

      # FETCH (WITH secrets): selects consensus candidates carrying a suggested
      # patch, calls the model to generate a repro spec per finding, and
      # materialises a disposable bare git mirror per spec under
      # /tmp/antfleet-mirror-* (the script's realCreateMirror). Writes
      # apps/web/repro-specs.json. Executes NO model code.
      - name: fetch (generate specs + mirrors)
        env:
          LIMIT: ${{ inputs.limit }}
          REPO: ${{ inputs.repo }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec tsx scripts/repro-verify-batch.ts \
            --phase fetch --limit "$LIMIT" --repo "$REPO" --out repro-specs.json

      # Build the sandbox image (network IS available here — this is the only
      # place the image may fetch its apt packages). Tag with the run id so
      # concurrent runs never collide.
      - name: build sandbox image
        run: |
          set -euo pipefail
          docker build -t "antfleet-repro-sandbox:${{ github.run_id }}" \
            -f .github/repro-exec/Dockerfile .

      # EXEC — the security-critical step. Runs the model-generated repros inside
      # ONE disposable `--network none`, non-root, cap-dropped container PER SPEC
      # (#145 Part 3, Issue 1). The verdict is the container's EXIT CODE, captured
      # into $RUNNER_TEMP/out/manifest.txt as "<index> <exitcode>".
      #
      # CRITICAL: this docker run passes NO secrets. The only -e vars are
      # non-secret markers/flags (ANTFLEET_REPRO_SANDBOX, ANTFLEET_REPRO_EXEC,
      # CI, HOME). The container's assertNoSecretsInEnv (allowlist-only) is the
      # fail-closed proof the exec env is secretless — plus the node image's own
      # HOSTNAME/NODE_VERSION/YARN_VERSION defaults are on that allowlist.
      #
      # CRITICAL: --workdir /work/apps/web. tsx resolves the `@/*` tsconfig paths
      # relative to the CWD; without this the container CWD is /work and the
      # imports fail with ERR_MODULE_NOT_FOUND. Each fetch-created bare mirror is
      # bound at its OWN host path :ro so both the spec's absolute `mirrorDir` and
      # the teardown's isOwnedMirrorDir check (dirname === /tmp inside the
      # container) resolve. $PWD (the repo) is bound read-only at /work; the
      # per-spec evidence file is written to the writable /out mount. tsx is
      # invoked via its resolved dist entrypoint (node .../tsx/dist/cli.mjs) — that
      # follows a RELATIVE symlink into /work/node_modules/.pnpm and needs no
      # network and no NODE_PATH, so it works offline.
      #
      # `set +e` around each docker run so a non-zero DECISION exit (20/30) does
      # NOT abort the loop; `timeout` wraps each run so a stuck descendant can't
      # stall the job.
      - name: exec (run model repros per-spec — NO secrets)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          COUNT="$(jq 'length' apps/web/repro-specs.json)"
          echo "exec: $COUNT spec(s) to run"
          VOLS=()
          for d in /tmp/antfleet-mirror-*; do
            [ -d "$d" ] && VOLS+=( -v "$d:$d:ro" )
          done
          i=0
          while [ "$i" -lt "$COUNT" ]; do
            # `${VOLS[@]+"${VOLS[@]}"}` expands to nothing when VOLS is empty and to
            # the quoted elements otherwise — safe under `set -u` on every bash
            # version (a bare "${VOLS[@]}" on an empty array errors on bash < 4.4).
            set +e
            timeout 900 docker run --rm --network none \
              --workdir /work/apps/web \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 512 --memory 4g --cpus 2 \
              -e ANTFLEET_REPRO_SANDBOX=1 -e ANTFLEET_REPRO_EXEC=true -e CI=1 -e HOME=/tmp \
              ${VOLS[@]+"${VOLS[@]}"} \
              -v "$PWD:/work:ro" -v "$RUNNER_TEMP/out:/out" \
              "antfleet-repro-sandbox:${{ github.run_id }}" \
              node /work/apps/web/node_modules/tsx/dist/cli.mjs \
                /work/apps/web/scripts/repro-verify-batch.ts \
                --phase verify-one --in /work/apps/web/repro-specs.json \
                --index "$i" --out "/out/evidence-$i.json"
            code=$?
            set -e
            echo "$i $code" >> "$RUNNER_TEMP/out/manifest.txt"
            echo "spec[$i] container exit=$code"
            i=$((i + 1))
          done
          echo "manifest:"
          cat "$RUNNER_TEMP/out/manifest.txt" || true

      # ASSEMBLE (no secrets): host-side, TRUSTED. Derives each verdict from the
      # container EXIT CODE in the manifest; the per-spec evidence files supply only
      # decision-independent context. Writes repro-verdicts.json.
      - name: assemble (exit codes -> verdicts)
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec tsx scripts/repro-verify-batch.ts \
            --phase assemble \
            --manifest "$RUNNER_TEMP/out/manifest.txt" \
            --evidence-dir "$RUNNER_TEMP/out" \
            --out "$RUNNER_TEMP/out/repro-verdicts.json"

      # RECORD (WITH the DB secret, WRITE-gated + idempotent). Only runs when the
      # operator explicitly asked to persist. Reads the assembled verdicts;
      # executes no model code.
      - name: record (persist verdicts)
        if: ${{ inputs.record == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec tsx scripts/repro-verify-batch.ts \
            --phase record --in "$RUNNER_TEMP/out/repro-verdicts.json" --record

      # Always upload the specs, the exit-code manifest, and the assembled
      # verdicts so a dispatched run is auditable even on failure.
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repro-exec-verify-${{ github.run_id }}
          path: |
            apps/web/repro-specs.json
            ${{ runner.temp }}/out/manifest.txt
            ${{ runner.temp }}/out/repro-verdicts.json
          if-no-files-found: warn
