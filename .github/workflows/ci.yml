name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web test:integration
      - run: pnpm --dir apps/web typecheck
      # `pnpm --dir apps/web exec next build` is intentionally NOT a gate
      # yet: the /disagreements/opengraph-image route prerenders via Satori
      # and fails on a pre-existing flex-display issue (reproduces on main).
      # Reintroduce this step once that route is fixed; until then,
      # typecheck above is the deployability proxy.
      - run: pnpm --dir apps/web exec tsx scripts/x402-live-smoke.ts --mode verify --skip-on-missing-creds

  sting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
        working-directory: sting
      - run: npm test
        working-directory: sting
